<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="拼豆（Hama Beads）像素图案工作室 - 管理221色库存，图片转像素图，用量计算">
  <meta name="theme-color" content="#C87050">
  <title>Perler Studio - 拼豆像素图案工作室</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; padding: 40px 20px; background: #FAF8F5; color: #3D3830; }
    .container { max-width: 800px; margin: 0 auto; text-align: center; }
    h1 { color: #C87050; font-size: 2.5em; margin-bottom: 10px; }
    .subtitle { color: #8B8680; font-size: 1.2em; margin-bottom: 30px; }
    .btn { display: inline-block; padding: 15px 40px; background: #C87050; color: white; text-decoration: none; border-radius: 8px; font-size: 1.2em; margin: 10px; transition: transform 0.2s; }
    .btn:hover { transform: scale(1.05); }
    .btn-secondary { background: #78A878; }
    .demo { margin-top: 50px; padding: 30px; background: white; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    .features { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-top: 30px; text-align: left; }
    .feature { padding: 20px; background: #F5F3EF; border-radius: 12px; }
    .feature h3 { margin: 0 0 10px; color: #C87050; }
    .feature p { margin: 0; color: #8B8680; }
    footer { margin-top: 50px; color: #8B8680; font-size: 0.9em; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎨 Perler Studio</h1>
    <p class="subtitle">拼豆（Hama Beads）像素图案工作室</p>
    
    <a href="perler-studio.html" class="btn">🚀 立即使用</a>
    
    <div class="demo">
      <h2>功能概览</h2>
      <div class="features">
        <div class="feature">
          <h3>🗂️ 库存管理</h3>
          <p>221色数据库，可视化色卡，库存筛选统计</p>
        </div>
        <div class="feature">
          <h3>🎨 图片转像素</h3>
          <p>上传任意图片，智能转换为拼豆图案</p>
        </div>
        <div class="feature">
          <h3>📦 用量计算</h3>
          <p>自动统计各色数量，生成采购清单</p>
        </div>
        <div class="feature">
          <h3>🖨️ 多格式导出</h3>
          <p>PNG/SVG/TXT，满足打印和分享需求</p>
        </div>
      </div>
    </div>
    
    <footer>
      <p>Made with ❤️ for Hama Bead enthusiasts | MIT License</p>
    </footer>
  </div>

</html>
